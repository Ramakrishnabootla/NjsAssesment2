<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Employee Management</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Employee Information</h1>

      <form id="employeeForm">
        <input type="hidden" id="empId" />
        <div class="row">
          <input id="name" placeholder="Name" required />
          <input id="age" placeholder="Age" type="number" required />
          <input id="mobile" placeholder="Mobile" required />
          <input id="city" placeholder="City" />
          <input id="department" placeholder="Department" />
          <input id="salary" placeholder="Salary" type="number" step="0.01" />
          <button type="submit" id="saveBtn">Add / Save</button>
        </div>
      </form>

      <div id="loading" class="loading" hidden>Loading...</div>

      <table id="employeesTable">
        <thead>
          <tr>
            <th>Id</th>
            <th>Name</th>
            <th>Age</th>
            <th>Mobile</th>
            <th>City</th>
            <th>Department</th>
            <th>Salary</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <script src="main.js"></script>
  </body>
  </html>
